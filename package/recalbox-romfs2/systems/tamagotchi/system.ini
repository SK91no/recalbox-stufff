; ===========================
; tamagotchi
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "41e38807-7ecc-4f1b-bc32-ac6a90931cdc"
name = "tamagotchi"
fullname = "Tamagotchi"
theme.folder = "tamagotchi"
roms.folder = "%ROOT%/ports/Tamagotchi"
screenscraper.id = 293
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/tamagotchi"
doc.link.en = "https://wiki.recalbox.com/en/emulators/tamagotchi"
doc.link.es = "https://wiki.recalbox.com/es/emulators/tamagotchi"
port = 1
readonly = 0
downloader = 0
icon.unicode = $F2f8
extension.types = "*=pcb"

[properties]
type = port
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "1996-11"
manufacturer = "Bandai"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_TAMALIBRETRO
priority = 0
emulator = "libretro"
core = "tamalibretro"
extensions = ".b .zip!"
netplay = 0
softpatching = 0
compatibility = high
speed = high
