; ===========================
; Epoch Cassette Vision
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "952089f8-f04d-4d87-914d-555e53085ad1"
name = "cassettevision"
fullname = "Epoch Cassette Vision"
theme.folder = "cassettevision"
roms.folder = "%ROOT%/cassettevision"
screenscraper.id = 300
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/consoles/cassette-vision"
doc.link.en = "https://wiki.recalbox.com/en/emulators/consoles/cassette-vision"
doc.link.es = "https://wiki.recalbox.com/es/emulators/consoles/cassette-vision"
port = 0
readonly = 0
icon.unicode = $F2FF
extension.types = "*=cart"

[properties]
type = console
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = optional
release.date = "1981-07"
manufacturer = "Epoch"
retroachievements = 0
crt.multiresolution = 1
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_PD777
priority = 1
emulator = "libretro"
core = "pd777"
extensions = ".bin777 .zip!"
netplay = 0
softpatching = 0
compatibility = high
speed = high
crt.available = 1
