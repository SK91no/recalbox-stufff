; ===========================
; Quake3
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "575d0d99-b4d5-4f42-a548-628c85e3317b"
name = "quake3"
fullname = "Quake 3"
theme.folder = "quake"
roms.folder = "%ROOT%/ports/Quake 3"
screenscraper.id = 135
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/ports/quake-3"
doc.link.en = "https://wiki.recalbox.com/en/emulators/ports/quake-3"
doc.link.es = "https://wiki.recalbox.com/es/emulators/ports/quake-3"
port = 1
readonly = 0
downloader = 1
icon.unicode = $F2cf
extension.types = "*=file"

[properties]
type = engine
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "1999-12"
manufacturer = "IdSoftware"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_VITAQUAKE3
priority = 1
emulator = "libretro"
core = "vitaquake3"
extensions = ".pk3"
netplay = 0
softpatching = 0
compatibility = high
speed = high
