; ===========================
; tombraider
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "0327277f-babc-49c3-8ad1-288623de14e5"
name = "tombraider"
fullname = "Tomb Raider"
theme.folder = "tombraider"
roms.folder = "%ROOT%/ports/Tomb Raider"
screenscraper.id = 135
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/"
doc.link.en = "https://wiki.recalbox.com/en/emulators/"
doc.link.es = "https://wiki.recalbox.com/es/emulators/"
port = 1
readonly = 0
downloader = 1
icon.unicode = $F2e5
extension.types = "*=file"

[properties]
type = port
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "1996-10"
manufacturer = "Core Design"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_OPENLARA
priority = 1
emulator = "openlara"
core = "openlara"
extensions = "files:Tomb Raider Gold (1998).zip"
netplay = 0
softpatching = 0
compatibility = high
speed = high
