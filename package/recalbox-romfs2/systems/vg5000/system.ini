; ===========================
; vg5000
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "382f194d-b670-4c8f-b56c-f6f74ce87b3b"
name = "vg5000"
fullname = "Philips VG 5000"
theme.folder = "vg5000"
roms.folder = "%ROOT%/vg5000"
screenscraper.id = 261
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/computers/vg5000"
doc.link.en = "https://wiki.recalbox.com/en/emulators/computers/vg5000"
doc.link.es = "https://wiki.recalbox.com/es/emulators/computers/vg5000"
port = 0
readonly = 0
icon.unicode = $F289
extension.types = "k7=tape"

[properties]
type = computer
device.pad = recommended
device.keyboard = mandatory
device.mouse = no
device.lightgun = no
release.date = "1984-09"
manufacturer = "Philips"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_RB5000
priority = 0
emulator = "rb5000"
core = "rb5000"
extensions = ".k7"
netplay = 0
softpatching = 0
compatibility = high
speed = high

[core.1]
package = BR2_PACKAGE_LIBRETRO_RB5000
priority = 0
emulator = "libretro"
core = "rb5000"
extensions = ".k7"
netplay = 0
softpatching = 0
compatibility = high
speed = high
