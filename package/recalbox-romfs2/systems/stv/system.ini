; ===========================
; stv
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "58194f2a-c0c7-4cc0-96f1-3eb44fef602a"
name = "stv"
fullname = "ST-V"
theme.folder = "stv"
roms.folder = "%ROOT%/stv"
screenscraper.id = 69
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/stv"
doc.link.en = "https://wiki.recalbox.com/en/emulators/stv"
doc.link.es = "https://wiki.recalbox.com/es/emulators/stv"
port = 0
readonly = 0
downloader = 0
icon.unicode = $F2DC
extension.types = "*=pcb"

[properties]
type = arcade
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "1995-01"
manufacturer = "Sega"
retroachievements = 1
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_KRONOS
priority = 1
emulator = "libretro"
core = "kronos"
extensions = ".zip!"
netplay = 0
softpatching = 0
compatibility = good
speed = good
crt.available = 0
arcade.file = mednafen-stv.lst

[core.1]
package = BR2_PACKAGE_LIBRETRO_MEDNAFEN_STV
priority = 2
emulator = "libretro"
core = "mednafen_stv"
extensions = ".zip!"
netplay = 0
softpatching = 0
compatibility = good
speed = good
crt.available = 1
arcade.file = mednafen-stv.lst

