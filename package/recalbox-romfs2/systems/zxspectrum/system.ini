; ===========================
; ZX Spectrum
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "c5e8f901-97e8-478f-a32f-61f49d071071"
name = "zxspectrum"
fullname = "ZXSpectrum"
theme.folder = "zxspectrum"
roms.folder = "%ROOT%/zxspectrum"
screenscraper.id = 76
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/computers/zx-spectrum"
doc.link.en = "https://wiki.recalbox.com/en/emulators/computers/zx-spectrum"
doc.link.es = "https://wiki.recalbox.com/es/emulators/computers/zx-spectrum"
port = 0
readonly = 0
icon.unicode = $F251
extension.types = "tap|tzx|wav|csw|pzx|ltp=tape,dsk|ipf=fd3,mgt|img|opd|opu|d80|fdi|udi|td0|sad=fd35,trd|scl|d40=fd525,mdr|mdv=md,rom|dck=cart,hdf|vhd=hd,z80|sna|sp|slt|szx|zxs|spc|sta|rzx=file"

[properties]
type = computer
device.pad = optional
device.keyboard = mandatory
device.mouse = no
device.lightgun = no
release.date = "1982-04"
manufacturer = "Sinclair"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_FUSE
priority = 1
emulator = "libretro"
core = "fuse"
extensions = ".csw .d40 .d80 .dck .dsk .fdi .hdf .img .ltp .mdr .mgt .opd .opu .pzx .rzx .sad .scl .slt .sna .sp .spc .sta .szx .tap .td0 .trd .tzx .udi .wav .z80 .zxs .zip! .7z!"
netplay = 0
softpatching = 0
compatibility = high
speed = high
crt.available = 1

[core.1]
package = BR2_PACKAGE_LIBRETRO_FBNEO
priority = 3
emulator = "libretro"
core = "fbneo"
extensions = ".zip! .7z!"
netplay = 0
softpatching = 0
compatibility = high
speed = high

[core.2]
package = BR2_PACKAGE_LIBRETRO_EIGHTYONE
priority = 2
emulator = "libretro"
core = "eightyone"
extensions = ".tap .tzx .wav .csw .opd .opu .mgt .img .dsk .ipf .trd .d40 .d80 .scl .slt .sp .mdr .mdv .rom .dck .hdf .vhd .z80 .sna .zip! .7z!"
netplay = 0
softpatching = 0
compatibility = high
speed = high
crt.available = 1
