; ===========================
; Gamecube
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "5db67a8d-3373-4166-94b8-14d95898b006"
name = "gamecube"
fullname = "GameCube"
theme.folder = "gc"
roms.folder = "%ROOT%/gamecube"
screenscraper.id = 13
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/consoles/gamecube"
doc.link.en = "https://wiki.recalbox.com/en/emulators/consoles/gamecube"
doc.link.es = "https://wiki.recalbox.com/es/emulators/consoles/gamecube"
port = 0
readonly = 0
icon.unicode = $F262
extension.types = "*=cd"

[properties]
type = console
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "2001-09"
manufacturer = "Nintendo"
retroachievements = 0
crt.multiresolution = 1
crt.multiregion = 1

[core.0]
package = BR2_PACKAGE_LIBRETRO_DOLPHIN
priority = 1
emulator = "libretro"
core = "dolphin"
extensions = ".ciso .dol .gc .gcm .gcz .iso .m3u .rvz .tgc .wia"
netplay = 0
softpatching = 0
compatibility = good
speed = good
crt.available = 1

[core.1]
package = BR2_PACKAGE_DOLPHIN_EMU
priority = 2
emulator = "dolphin-gui"
core = "dolphin-gui"
extensions = ".ciso .dol .gc .gcm .gcz .iso .json .m3u .rvz .tgc .wia"
netplay = 1
softpatching = 0
compatibility = good
speed = good
speed.rpi4_64 = low
video.backend.rpi4_64 = wayland
video.backend.rpi5_64 = wayland
crt.available = 1

[core.2]
package = BR2_PACKAGE_DOLPHIN_EMU
priority = 3
emulator = "dolphin"
core = "dolphin"
extensions = ".ciso .dol .gc .gcm .gcz .iso .json .m3u .rvz .tgc .wia"
netplay = 1
softpatching = 0
compatibility = good
speed = good
speed.rpi4_64 = low
crt.available = 1
