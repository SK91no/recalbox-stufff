; ===========================
; Vircon32
; ===========================

; all keys can be overridden for a particular board using key.<boardtag>
; example:
;   priority = 0
;   priority.rpi4 = 3
; Complete sections may be overridden. In such cases, all key from the global section are ignored,
; you must redefine them all
; example
; [core.0]
; [core.0.rpi4]
; Board tags are defined by BR2_PACKAGE_RECALBOX_TARGET_<tag>

[system]
uuid = "61201059-d99f-4f86-ac36-aac1ca1fc6f6"
name = "vircon32"
fullname = "Vircon32"
theme.folder = "vircon32" 
roms.folder = "%ROOT%/vircon32"
screenscraper.id = 272
doc.link.fr = "https://wiki.recalbox.com/fr/emulators/fantasy/vircon32"
doc.link.en = "https://wiki.recalbox.com/en/emulators/fantasy/vircon32"
doc.link.es = "https://wiki.recalbox.com/es/emulators/fantasy/vircon32"
port = 0
readonly = 0
downloader = 0
icon.unicode = $F2F5
extension.types = "*=file"

[properties]
type = console
device.pad = mandatory
device.keyboard = no
device.mouse = no
device.lightgun = no
release.date = "2023-09"
manufacturer = "virtual"
retroachievements = 0
crt.multiresolution = 0
crt.multiregion = 0

[core.0]
package = BR2_PACKAGE_LIBRETRO_VIRCON32
priority = 1
emulator = "libretro"
core = "vircon32"
extensions = ".v32"
netplay = 0
softpatching = 0
compatibility = high
speed = high
crt.available = 1
