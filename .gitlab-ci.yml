    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /patron/i
  when: manual
  variables:
    DEPLOY_TYPE: review
    BUCKET: recalbox-archive-patron
  environment:
    name: patron/${CI_COMMIT_REF_SLUG}
    
release rrgbd2:
  <<: *release_definition
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /rrgbd2/i
  when: manual
  variables:
    DEPLOY_TYPE: review
    BUCKET: recalbox-archive-rrgbd2
  environment:
    name: rrgbd2/${CI_COMMIT_REF_SLUG}

release jvs:
